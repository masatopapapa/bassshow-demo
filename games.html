<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BASS SHOW 小游戏合集</title>
<style>
  :root{
    --bg:#0d0e12;
    --panel:#16181f;
    --panel-2:#1d2029;
    --line:#2a2e3a;
    --text:#f2f3f7;
    --muted:#9aa0ac;
    --accent:#ff5a2c;      /* BASS SHOW オレンジ */
    --accent-2:#ffb02e;
    --warm:#ff7a45;
    --cool:#3aa0ff;
    --pop:#9b6bff;
    --green:#2ec27e;
    /* FingerSpeed v5 準拠（三段導線用）*/
    --bg2:#13131A;
    --border:rgba(255,255,255,0.08);
    --text3:#5A5870;
    --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Microsoft YaHei","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{max-width:560px;margin:0 auto;padding:0 16px 40px;min-height:100vh;}

  /* ---- 言語切替 ---- */
  .lang-bar{display:flex;justify-content:flex-end;gap:6px;padding:12px 0 4px;}
  .lang-btn{font-size:12px;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:5px 12px;cursor:pointer;}
  .lang-btn.active{color:#fff;background:var(--accent);border-color:var(--accent);}

  /* ---- ヘッダー ---- */
  .header{text-align:center;padding:18px 0 18px;}
  .logo-frame{width:104px;height:104px;margin:0 auto 18px;border-radius:26px;
    padding:3px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 10px 30px rgba(255,90,44,.28);}
  .logo{width:100%;height:100%;border-radius:23px;display:block;object-fit:cover;}
  .intro{position:relative;margin:0 auto 20px;max-width:330px;padding:2px 0;}
  .intro .line{font-size:13px;line-height:1.7;color:var(--muted);margin:5px 0;}
  .intro .line.lead{color:var(--text);font-weight:600;font-size:13.5px;}
  .intro .line.punch{color:var(--accent-2);font-weight:700;
    display:inline-block;margin-top:9px;padding:5px 14px;border-radius:14px;
    background:rgba(255,176,46,.10);border:0.5px solid rgba(255,176,46,.30);}
  .hub-title{font-size:25px;font-weight:800;letter-spacing:.5px;line-height:1.25;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

  /* ---- セクション ---- */
  .section{margin:0 0 22px;}
  .section-title{font-size:14px;font-weight:700;color:var(--muted);
    margin:0 2px 12px;display:flex;align-items:center;gap:8px;}
  .section-title .dot{width:8px;height:8px;border-radius:50%;}

  /* ---- ゲームカードグリッド ---- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;
    gap:10px;transition:transform .12s ease,border-color .12s ease;position:relative;overflow:hidden;}
  .card:active{transform:scale(.97);}
  .card.live:hover{border-color:var(--accent);}
  .thumb{width:100%;aspect-ratio:1/1;border-radius:12px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;background:#000;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .c-title{font-size:14px;font-weight:700;line-height:1.3;}
  .card .c-desc{font-size:11.5px;color:var(--muted);line-height:1.5;}
  .badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;
    padding:3px 8px;border-radius:10px;background:var(--green);color:#04140c;z-index:2;}
  .card.coming{pointer-events:none;}
  .card.coming .badge{background:rgba(20,20,26,.85);color:var(--muted);border:0.5px solid var(--border);}
  .card.coming .thumb img{filter:grayscale(1) brightness(.5);}
  .coming-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:1;}
  .coming-overlay span{font-size:13px;font-weight:800;letter-spacing:1px;color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.8);border:1.5px solid rgba(255,255,255,.85);
    border-radius:8px;padding:5px 12px;background:rgba(0,0,0,.35);}
  .card.coming .c-title,.card.coming .c-desc{opacity:.55;}

  /* ---- 三段導線（FingerSpeed v5 と統一）---- */
  .promo-section{margin:8px 0 14px;}
  .promo-title{font-size:11px;color:var(--text3);letter-spacing:2px;text-align:center;margin-bottom:10px;}
  .promo-cards{display:flex;flex-direction:column;gap:8px;}
  .promo-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);
    padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .promo-card:active{transform:scale(.99);}
  .promo-icon{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
  .promo-icon img{width:100%;height:100%;object-fit:cover;border-radius:9px;}
  .promo-icon-bs{background:linear-gradient(135deg,#0F6E56,#534AB7);}
  .promo-icon-bili{background:linear-gradient(135deg,#00A1D6,#0066CC);}
  .promo-icon-gzh{background:linear-gradient(135deg,#07C160,#0F6E56);}
  .promo-text{flex:1;}
  .promo-name{font-size:14px;font-weight:700;}
  .demo-tag{font-size:10px;font-weight:700;color:var(--accent-2);border:0.5px solid var(--accent-2);
    border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap;}
  .promo-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .promo-arrow{color:var(--text3);font-size:18px;}
  .gzh-qr-wrap{display:none;flex-direction:column;align-items:center;gap:8px;
    background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;margin-top:-2px;}
  .gzh-qr-wrap.show{display:flex;}
  .gzh-qr-wrap img{width:160px;height:160px;border-radius:8px;background:#fff;padding:6px;box-sizing:border-box;}
  .gzh-qr-wrap p{font-size:11px;color:var(--muted);text-align:center;line-height:1.6;margin:0;}
  .copyright{text-align:center;font-size:11px;color:var(--muted);margin-top:18px;}
.card.reaction-teaser{border-color:#665035;background:linear-gradient(155deg,#222027,#16181f)}.card.reaction-teaser .thumb img{filter:grayscale(1) brightness(.7)}.card.reaction-teaser .badge{color:#ffb02e;border-color:#79572a;background:#211b14}.card.reaction-teaser .c-title{opacity:1}.card.reaction-teaser .c-desc{opacity:1;color:#b4b6c0}.card.reaction-teaser .coming-overlay{align-items:flex-end;padding:10px 4px}.card.reaction-teaser .coming-overlay span{font-size:12px;letter-spacing:.3px;padding:5px 9px;background:rgba(0,0,0,.9);border-color:#b6b6b6}
</style>
<script src="shared-assets.js"></script>
</head>
<body>

<div class="lang-bar" id="langBar">
  <button class="lang-btn active" data-lang="zh">中文</button>
  <button class="lang-btn" data-lang="ja">日本語</button>
  <button class="lang-btn" data-lang="en">EN</button>
</div>

<div class="header">
  <div class="logo-frame"><img class="logo" id="logo" alt="BASS SHOW"></div>
  <div class="intro">
    <p class="line lead" id="introLead"></p>
    <p class="line" id="introMid"></p>
    <span class="line punch" id="introPunch"></span>
  </div>
  <div class="hub-title">BASS SHOW <span id="hubTitleSub"></span></div>
</div>

<div id="sections"></div>

<!-- 三段導線（FingerSpeed v5 と統一） -->
<div class="promo-section">
  <div class="promo-title" id="promoTitle"></div>
  <div class="promo-cards">

    <div class="promo-card" id="gzh-card">
      <div class="promo-icon promo-icon-gzh">📱</div>
      <div class="promo-text">
        <div class="promo-name" id="gzhName"></div>
        <div class="promo-desc" id="gzhDesc"></div>
      </div>
      <div class="promo-arrow" id="gzh-arrow">›</div>
    </div>
    <div class="gzh-qr-wrap" id="gzh-qr-wrap">
      <img id="gzhQrImg" alt="BASS SHOW 公众号 QR">
      <p id="gzhSteps"></p>
    </div>

    <div class="promo-card" onclick="window.open('https://b23.tv/CGkvQc4','_blank')">
      <div class="promo-icon promo-icon-bili">📺</div>
      <div class="promo-text">
        <div class="promo-name" id="biliName"></div>
        <div class="promo-desc" id="biliDesc"></div>
      </div>
      <div class="promo-arrow">›</div>
    </div>

    <div class="promo-card" onclick="window.open('platform.html','_blank')">
      <div class="promo-icon promo-icon-bs"><img id="bsLogoImg" alt="BASS SHOW"></div>
      <div class="promo-text">
        <div class="promo-name"><span id="platName"></span><span class="demo-tag" id="demoTag"></span></div>
        <div class="promo-desc" id="platDesc"></div>
      </div>
      <div class="promo-arrow">›</div>
    </div>

  </div>
</div>

<div class="copyright">© BASS SHOW</div>

var CATEGORY_DOT = { diagnose:"var(--accent)", training:"var(--cool)" };

function renderGameCard(game, lang){
  var t = game.title[lang];
  var d = game.desc[lang];
  var isLive = game.status === "live";
  var badge = game.teaser ? "NEW GAME" : (isLive ? I18N[lang].live : I18N[lang].coming);
  var cls = "card " + (isLive ? "live" : "coming") + (game.teaser ? " reaction-teaser" : "");
  var tag = isLive ? "a" : "div";
  var overlay = isLive ? "" :
    '<div class="coming-overlay"><span>' + (game.teaser ? 'Coming Soon' : I18N[lang].coming) + '</span></div>';
  return '<' + tag + ' class="' + cls + '"' + (isLive ? ' href="' + game.entry + '"' : '') + '>' +
           '<span class="badge">' + badge + '</span>' +
           '<div class="thumb">' +
             '<img src="' + game.thumbImg + '" alt="' + t + '">' +
             overlay +
           '</div>' +
           '<div class="c-title">' + t + '</div>' +
           '<div class="c-desc">' + d + '</div>' +
         '</' + tag + '>';
}

function renderSections(lang){
  var html = "";
  CATEGORY_ORDER.forEach(function(cat){
    var items = GAMES.filter(function(g){ return g.category === cat; });
    if(!items.length) return;
    // live を上、coming を下に並べる
    items.sort(function(a,b){
      if(a.status === b.status) return 0;
      return a.status === "live" ? -1 : 1;
    });
    html += '<div class="section">' +
              '<div class="section-title"><span class="dot" style="background:' + CATEGORY_DOT[cat] + '"></span>' +
              I18N[lang][cat] + '</div>' +
              '<div class="grid">' +
              items.map(function(g){ return renderGameCard(g, lang); }).join("") +
              '</div></div>';
  });
  document.getElementById("sections").innerHTML = html;
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.getElementById("introLead").textContent = I18N[lang].intro[0];
  document.getElementById("introMid").textContent = I18N[lang].intro[1];
  document.getElementById("introPunch").textContent = I18N[lang].introPunch;
  document.getElementById("hubTitleSub").textContent = I18N[lang].hubSub;
  // 三段導線
  document.getElementById("promoTitle").textContent = I18N[lang].promoTitle;
  document.getElementById("gzhName").textContent = I18N[lang].gzhName;
  document.getElementById("gzhDesc").innerHTML = I18N[lang].gzhDesc;
  document.getElementById("gzhSteps").innerHTML = I18N[lang].gzhSteps;
  document.getElementById("biliName").textContent = I18N[lang].biliName;
  document.getElementById("biliDesc").innerHTML = I18N[lang].biliDesc;
  document.getElementById("platName").textContent = I18N[lang].platName;
  document.getElementById("demoTag").textContent = I18N[lang].demoTag;
  document.getElementById("platDesc").innerHTML = I18N[lang].platDesc;
  renderSections(lang);
  // 言語ボタンの active 切替
  var btns = document.querySelectorAll(".lang-btn");
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle("active", btns[i].getAttribute("data-lang") === lang);
  }
}

// ロゴ・QR・三段アイコンの画像差し込み（Base64）
document.getElementById("logo").src = IMG_GAMES;  /* ハブ代表アイコンをICON_GAMESに（footerのbsLogoImgはLOGO維持） */
document.getElementById("gzhQrImg").src = window.BS_ASSETS.GZH_QR;
document.getElementById("bsLogoImg").src = LOGO_BASE64;

// 言語ボタン
document.getElementById("langBar").addEventListener("click", function(e){
  var b = e.target.closest(".lang-btn");
  if(b){ applyLang(b.getAttribute("data-lang")); }
});

// 交流群カード：タップでQRをアコーディオン展開（FingerSpeed v5 と同一挙動）
document.getElementById("gzh-card").addEventListener("click", function(){
  var w = document.getElementById("gzh-qr-wrap");
  var open = w.classList.toggle("show");
  document.getElementById("gzh-arrow").textContent = open ? "⌄" : "›";
});

// 初期表示（デフォルト中国語）
applyLang("zh");

</script>
</body>
</html>
