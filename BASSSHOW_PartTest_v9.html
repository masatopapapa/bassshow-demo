<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你适合乐队哪个位置？ / あなたに合うバンドパートは？</title>
<style>
  :root{
    --bg:#0a0a0f; --bg2:#12101c; --ink:#f4f1e8; --muted:#9a93a8;
    --accent:#ff4d6d; --accent2:#ffd23f; --line:rgba(255,255,255,.12); --card:rgba(255,255,255,.045);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #241a33 0%, var(--bg) 60%), var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .wrap{max-width:480px;margin:0 auto;padding:18px 18px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.5px;font-size:15px;}
  .logo .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);}
  /* 3言語スイッチ（中/日/EN） */
  .bs-lang-switch{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px;flex:none;}
  .bs-lang-switch button{background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;cursor:pointer;line-height:1;}
  .bs-lang-switch button.active{background:var(--accent);color:#fff;}
  /* 共通ヘッダー内のバナーは左寄せ（マージン詰め） */
  .topbar .bs-topbar{margin:0;justify-content:flex-start;}
  .screen{display:none;animation:fade .35s ease;}
  .screen.on{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ===== UI統一テンプレ (フェーズC) ===== */
  .bs-topbar{display:flex;justify-content:center;margin:14px 0 4px;}
  .bs-topbar img{height:34px;width:auto;display:block;}
  .bs-hero{width:130px;height:130px;margin:8px auto 6px;border-radius:16px;object-fit:cover;display:block;background:#000;}
  /* 三段導線（Finger v5 基準） */
  .promo-section{margin-bottom:14px;margin-top:18px;}
  .promo-title{font-size:11px;color:var(--muted);letter-spacing:2px;text-align:center;margin-bottom:10px;}
  .promo-cards{display:flex;flex-direction:column;gap:8px;}
  .promo-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:var(--ink);}
  .promo-card:active{transform:scale(.99);}
  .promo-icon{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
  .promo-icon img{width:100%;height:100%;object-fit:cover;border-radius:9px;}
  .promo-icon-bili{background:linear-gradient(135deg,#00A1D6,#0066CC);}
  .promo-icon-gzh{background:linear-gradient(135deg,#07C160,#0F6E56);}
  .promo-icon-games{background:linear-gradient(135deg,#E8552D,#B7841E);}
  .promo-icon-bs{background:linear-gradient(135deg,#0F6E56,#534AB7);}
  .promo-icon img{width:100%;height:100%;object-fit:cover;border-radius:9px;}
  .promo-text{flex:1;min-width:0;}
  .promo-name{font-size:14px;font-weight:700;}
  .promo-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .promo-arrow{color:var(--muted);font-size:18px;flex:none;}
  .demo-tag{font-size:10px;font-weight:700;color:var(--accent2);border:1px solid var(--accent2);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
  /* 截图分享ボタン行（カード外） */
  .share-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 10px;}
  .share-btn{padding:13px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;text-align:center;}
  .share-btn.primary{background:linear-gradient(120deg,var(--accent),#ff7a3d);color:#fff;border-color:transparent;}
  .share-btn:active{transform:scale(.98);}

  .hero{text-align:center;padding:34px 14px 10px;}
  .kicker{font-size:12px;letter-spacing:3px;color:var(--accent2);font-weight:800;text-transform:uppercase;}
  .title{font-size:30px;line-height:1.18;font-weight:900;margin:14px 0 8px;background:linear-gradient(90deg,#fff 20%,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{color:var(--muted);font-size:14px;line-height:1.6;margin:0 8px 6px;}
  .spoiler{margin:20px auto 0;max-width:340px;font-size:12.5px;color:#cdbfe0;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,77,109,.06);}
  .types-preview{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:18px 4px 0;}
  .chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);}
  .btn{display:block;width:100%;border:none;cursor:pointer;background:linear-gradient(120deg,var(--accent),#ff7a3d);color:#fff;font-weight:900;font-size:17px;letter-spacing:1px;padding:16px;border-radius:16px;margin-top:26px;box-shadow:0 10px 30px rgba(255,77,109,.35);}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);box-shadow:none;font-size:15px;}
  .progress{height:5px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-bottom:20px;}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s;}
  .qcount{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;}
  .qtext{font-size:21px;font-weight:800;line-height:1.45;min-height:96px;}
  .opts{margin-top:18px;display:flex;flex-direction:column;gap:11px;}
  .opt{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:15px 16px;border-radius:14px;font-size:15px;line-height:1.45;cursor:pointer;transition:transform .12s,border-color .2s,background .2s;}
  .opt:active{transform:scale(.985);}
  .opt:hover{border-color:var(--accent);background:rgba(255,77,109,.08);}
  .opt b{color:var(--accent2);margin-right:8px;}
  .res-card{position:relative;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:linear-gradient(160deg,rgba(255,77,109,.14),rgba(255,210,63,.05));}
  .res-top{padding:26px 22px 18px;text-align:center;border-bottom:1px solid var(--line);}
  .res-logo{width:64px;height:64px;border-radius:50%;display:block;margin:0 auto 14px;box-shadow:0 4px 16px rgba(255,77,109,.25);}
  .res-emoji{font-size:54px;line-height:1;margin-bottom:6px;}
  .res-emoji .char-img{width:160px;height:160px;object-fit:contain;border-radius:16px;margin:0 auto;display:block;}
  .res-kick{font-size:11px;letter-spacing:2px;color:var(--accent2);font-weight:800;}
  .res-name{font-size:26px;font-weight:900;margin:6px 0 0;}
  .res-tag{font-size:13px;color:var(--muted);margin-top:6px;font-style:italic;}
  .res-rare{display:inline-block;margin-top:10px;font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#1a1320;}
  .res-body{padding:20px 22px;font-size:14.5px;line-height:1.7;color:#e7e1d6;}
  .res-body .punch{color:var(--accent);font-weight:800;}
  .bars{padding:4px 22px 18px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12px;color:var(--muted);}
  .bar-row .lab{width:80px;flex:none;text-align:right;}
  .bar-track{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;}
  .bar-fill{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width 1s cubic-bezier(.22,1,.36,1);}
  .row2{display:flex;gap:10px;margin-top:14px;}
  .row2 .btn{margin-top:0;}
  .footer{text-align:center;font-size:11px;color:var(--muted);margin-top:26px;letter-spacing:1px;}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;font-weight:700;font-size:13px;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:50;}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .hero-logo{width:128px;height:128px;border-radius:50%;display:block;margin:8px auto 0;box-shadow:0 6px 26px rgba(255,77,109,.28);}
  .share-logo{width:34px;height:34px;border-radius:50%;flex:none;}
  .share-head{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
  .share-head b{font-size:13px;font-weight:800;letter-spacing:.5px;}
  .links{margin-top:14px;display:flex;flex-direction:column;gap:11px;}
  .link-card{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);text-decoration:none;color:var(--ink);transition:border-color .2s,background .2s;}
  .link-card:active{transform:scale(.99);}
  .link-card:hover{border-color:var(--accent);background:rgba(255,77,109,.06);}
  .link-ico{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;}
  .link-ico img{width:100%;height:100%;object-fit:cover;border-radius:12px;}
  .link-ico.bili{background:#00aeec;color:#fff;}
  .link-ico.games{background:linear-gradient(135deg,#E8552D,#B7841E);color:#fff;}
  .link-body{flex:1;min-width:0;}
  .link-body .lt{font-size:14.5px;font-weight:800;}
  .link-body .ls{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .link-arrow{color:var(--muted);font-size:18px;flex:none;}
  .links-head{text-align:center;font-size:12px;color:var(--muted);letter-spacing:2px;margin:24px 0 4px;}
  /* トップ案内カード */
  .intro-card{border:1px solid var(--line);border-radius:18px;padding:18px 18px 20px;background:linear-gradient(160deg,rgba(255,77,109,.08),rgba(255,210,63,.03));margin-top:20px;text-align:left;}
  .intro-card .ic-q{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6;color:#e7e1d6;}
  .intro-card .ic-q+.ic-q{margin-top:12px;}
  .intro-card .ic-mark{flex:none;width:22px;height:22px;border-radius:50%;background:rgba(255,77,109,.18);color:var(--accent2);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .parts-row{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:18px 0 4px;}
  .part-pill{display:flex;flex-direction:column;align-items:center;gap:4px;width:56px;}
  .part-pill .pp-ico{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;}
  .part-pill .pp-ico.bass-ico{filter:hue-rotate(150deg) saturate(1.3);}
  .part-pill .pp-lab{font-size:10.5px;color:var(--muted);letter-spacing:.3px;}
  .intro-tagline{text-align:center;font-size:13px;color:var(--accent2);font-weight:700;margin-top:16px;line-height:1.6;}
  /* シェア切替 */
  .share-in{margin:4px 18px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .share-row{display:flex;gap:12px;align-items:center;}
  .share-icon{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none;display:block;}
  .share-left{flex:1;min-width:0;}
  .share-right{flex:none;text-align:center;width:96px;}
  .share-text{font-size:11.5px;line-height:1.5;color:#d8d2e4;white-space:pre-wrap;}
  .share-right .qrbox{display:inline-block;background:#fff;padding:5px;border-radius:9px;}
  .share-right .qrbox svg{display:block;width:80px;height:80px;}
  .qrcap{font-size:10px;color:var(--muted);margin:5px auto 0;max-width:96px;white-space:normal;word-break:break-word;line-height:1.35;}
  .share-rname{font-size:14px;font-weight:900;color:var(--accent2);margin-bottom:5px;}
  .share-rname:empty{display:none;}
  /* 非公開モード：白い霧で結果を隠す */
  .hide-overlay{display:none;position:absolute;inset:0;z-index:5;border-radius:22px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 24px;color:#1a1320;}
  .res-card.hidden .hide-overlay{display:flex;}
  .hide-overlay .hide-logo{width:96px;height:96px;border-radius:50%;box-shadow:0 6px 22px rgba(0,0,0,.25);}
  .hide-overlay .hide-text{font-size:14px;line-height:1.6;font-weight:700;margin:16px 0;color:#1a1320;white-space:pre-wrap;}
  .hide-overlay .qrbox{display:inline-block;background:#fff;padding:7px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.18);}
  .hide-overlay .qrbox svg{display:block;width:110px;height:110px;}
  .hide-overlay .qrcap{color:#5a5266;}
  .share-switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
  .share-switch>span{font-size:11.5px;color:var(--muted);flex:none;}
  .share-toggle{display:flex;gap:6px;}
  .stog{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;transition:.2s;}
  .stog.on{background:rgba(255,77,109,.14);color:var(--ink);border-color:var(--accent);}
  .share-rname{font-size:16px;font-weight:900;color:var(--accent2);margin-bottom:8px;}
  .share-rname:empty{display:none;}
  .gzh-ico{background:rgba(7,193,96,.15);color:#07c160;}
  .gzh-qr-wrap{display:none;text-align:center;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-top:-2px;}
  .gzh-qr-wrap.show{display:block;}
  .gzh-qr-wrap img{display:block;margin:0 auto;width:200px;height:200px;border-radius:10px;}
  .gzh-qr-wrap p{font-size:11.5px;color:var(--muted);margin:8px 0 0;}
</style>
<script src="shared-assets.js"></script>
</head>
<body>
<div class="wrap">
  <!-- 共通ヘッダー：左上バナー1つ＋右上3言語スイッチ（全画面共通） -->
  <div class="topbar">
    <div class="bs-topbar"><img id="bs-banner-start" alt="BASS SHOW"></div>
    <div class="bs-lang-switch" id="bs-lang-switch">
      <button data-lang="zh" class="active">中</button>
      <button data-lang="ja">日</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <section class="screen on" id="s-intro">
    <div class="hero">
      <img class="bs-hero" id="bs-hero-part" alt="">
      <div class="kicker" data-i="kicker" style="margin-top:18px"></div>
      <h1 class="title" data-i="title"></h1>

      <div class="parts-row" id="partsRow"></div>

      <div class="intro-card">
        <div class="ic-q"><span class="ic-mark">?</span><span data-i="introQ1"></span></div>
        <div class="ic-q"><span class="ic-mark">?</span><span data-i="introQ2"></span></div>
      </div>
      <p class="intro-tagline" data-i="introTag"></p>

      <button class="btn" id="startBtn" data-i="start"></button>
    </div>
  </section>

  <section class="screen" id="s-quiz">
    <div class="progress"><i id="prog"></i></div>
    <div class="qcount" id="qcount"></div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
  </section>

  <section class="screen" id="s-result">
    <div class="res-card" id="resCard">
      <div class="res-top">
        <div class="res-emoji" id="rEmoji"></div>
        <div class="res-kick" data-i="rkick"></div>
        <div class="res-name" id="rName"></div>
        <div class="res-tag" id="rTag"></div>
        <div id="rRare"></div>
      </div>

      <!-- シェア：結果名の直後に配置（キャラ画像＋結果名＋紹介文＋QRが1画面に収まる） -->
      <div class="share-in">
        <div class="share-row">
          <img class="share-icon" id="shareIcon" alt="PartTest">
          <div class="share-left">
            <div id="rShare" class="share-text"></div>
          </div>
          <div class="share-right">
            <div class="qrbox" id="qrBox"></div>
            <p class="qrcap" data-i="qrtext"></p>
          </div>
        </div>
      </div>

      <div class="res-body" id="rBody"></div>
      <div class="bars" id="rBars"></div>

      <!-- 非公開モード用：結果を白い霧で隠し、ロゴ＋案内＋QRを表示 -->
      <div class="hide-overlay" id="hideOverlay">
        <img class="hide-logo" id="hideLogo" alt="BASS SHOW">
        <div class="hide-text" id="hideShare"></div>
        <div class="qrbox" id="hideQrBox"></div>
        <p class="qrcap" data-i="qrtext"></p>
      </div>
    </div>

    <!-- シェア方式の切替（結果カードの外・操作用） -->
    <div class="share-switch">
      <span data-i="shareSwitchLabel"></span>
      <div class="share-toggle">
        <button class="stog on" id="togOpen" data-i="togOpen"></button>
        <button class="stog" id="togHide" data-i="togHide"></button>
      </div>
    </div>

    <!-- 截图分享（機能なし＝手動スクショ案内）＋ 复制文字 -->
    <div class="share-btn-row">
      <button class="share-btn primary" id="btn-screenshot" data-i="btnScreenshot"></button>
      <button class="share-btn" id="copyBtn" data-i="copy"></button>
    </div>

    <!-- 三段導線（Finger v5 基準・promo-section形式） -->
    <div class="promo-section">
      <div class="promo-title" data-i="linksHead"></div>
      <div class="promo-cards">
      <div class="promo-card" id="gzhCard">
        <div class="promo-icon promo-icon-gzh">📱</div>
        <div class="promo-text">
          <div class="promo-name" data-i="gzhTitle"></div>
          <div class="promo-desc" data-i="gzhSub"></div>
        </div>
        <div class="promo-arrow" id="gzhArrow">›</div>
      </div>
      <div class="gzh-qr-wrap" id="gzhQrWrap">
        <img id="gzhQrImg" alt="BASS SHOW 公众号 QR">
        <p data-i="gzhQrText"></p>
      </div>
      <a class="promo-card" href="https://b23.tv/CGkvQc4" target="_blank" rel="noopener">
        <div class="promo-icon promo-icon-bili">📺</div>
        <div class="promo-text">
          <div class="promo-name" data-i="biliCardTitle"></div>
          <div class="promo-desc" data-i="biliDesc"></div>
        </div>
        <div class="promo-arrow">›</div>
      </a>
      <a class="promo-card" id="linkBS" href="https://bassshow.rocks/platform.html" target="_blank" rel="noopener">
        <div class="promo-icon promo-icon-bs"><img id="bs-promo-platform-icon" alt="BASS SHOW"></div>
        <div class="promo-text">
          <div class="promo-name">BASS SHOW <span class="demo-tag" data-i="demoTag"></span></div>
          <div class="promo-desc" data-i="bsCardSub"></div>
        </div>
        <div class="promo-arrow">›</div>
      </a>
      <a class="promo-card" href="https://bassshow.rocks/minigames.html" target="_blank" rel="noopener">
        <div class="promo-icon promo-icon-bs"><img id="bs-promo-games-icon" alt="BASS SHOW"></div>
        <div class="promo-text">
          <div class="promo-name" data-i="gamesName"></div>
          <div class="promo-desc" data-i="gamesDesc"></div>
        </div>
        <div class="promo-arrow">›</div>
      </a>
      </div>
    </div>

    <button class="btn ghost" id="retryBtn" data-i="retry"></button>
    <div class="footer">BASS SHOW · 贝斯手社区 · 2026</div>
  </section>
</div>
<div class="toast" id="toast"></div>


<!-- ===== アプリ本体 ===== -->
<script>
/* ============================================================
   BASS SHOW - バンドパート診断 v1（レア型）
   軸: spot(目立ち) tech(技術) free(自由) voc(ボーカル)
   全結果ベーシスト。9タイプ。ロジック検証済み。
   ============================================================ */
const PAGES_URL = "https://bassshow.rocks/";
/* シェアQRが指す診断ゲーム専用入口（常に最新版へ・ルートと独立） */
const SHARE_URL = "https://bassshow.rocks/parttest.html";

/* ---------- 固定正規化スケール（出題内容によらず安定） ---------- */
const FIXED={spot:[-22,22],tech:[-16,24],free:[-16,24],voc:[-20,22]};
const norm=(k,v)=>Math.max(0,Math.min(100,(v-FIXED[k][0])/(FIXED[k][1]-FIXED[k][0])*100));

/* ---------- 判定パラメータ（最適化済み・固定スケール基準） ---------- */
const P={"jzT":65,"jzF":54,"jzS":55,"jzV":44,"spotHi":55,"starT":48,"gtT":58,"gtV":53,"soT":56,"soV":53,"nvT":53,"nvV":82,"bvV":56,"soLoT":62,"soLoS":45,"soLoV":50,"delS":29,"rockF":56};

/* ---------- 判定（レア型・9タイプ） ---------- */
function judge(s){
  const S=norm("spot",s.spot),Te=norm("tech",s.tech),F=norm("free",s.free),V=norm("voc",s.voc);
  if(Te>=P.jzT && F>=P.jzF && S<=P.jzS && V<=P.jzV) return "jazz";   // マニアック少数派
  if(S>=P.spotHi){
    if(Te<=P.starT)          return "star";         // 目立ち高×技術低め＝目立ちたがり
    if(Te>=P.gtT && V>=P.gtV) return "guitarist";   // 技術＋モテたい
    if(Te>=P.soT && V<P.soV)  return "solo";         // 技術で魅せる・歌わぬ
    if(Te<=P.nvT && V>=P.nvV) return "novocal";      // 歌だけ・技術最低
    if(V>=P.bvV)              return "basevocal";    // 歌える目立ち
    return "star";                                   // それ以外の目立ち
  }
  if(Te>=P.soLoT && S>=P.soLoS && V<P.soLoV) return "solo"; // 控えめでも技術突出
  if(S<=P.delS) return "delivery";                  // 受け身・地位低（メイン級に拡大）
  if(F>=P.rockF) return "rock";                     // 自由度高
  return "core";                                    // 根っから
}

const TOTAL_Q=10;   // 出題総数（8問+動的2問）
let lang="zh", quizQ=[], idx=0, score={spot:0,tech:0,free:0,voc:0}, resultKey=null, shareMode="open";
const el = id=>document.getElementById(id);

  document.querySelectorAll("#bs-lang-switch button").forEach(b=>b.classList.toggle("active", b.getAttribute("data-lang")===lang));

/* ---------- 出題ロジック ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQuiz(){
  // 各軸からランダムに2問ずつ=8問を選び、残りを動的分別の候補に
  const byAxis={tech:[],spot:[],free:[],voc:[]};
  POOL.forEach(q=>byAxis[q.axis].push(q));
  let first8=[], remaining=[];
  ["tech","spot","free","voc"].forEach(ax=>{
    const sh=shuffle(byAxis[ax]);
    first8.push(sh[0],sh[1]);
    remaining.push(...sh.slice(2));
  });
  first8=shuffle(first8);
  // 各問の選択肢順もシャッフル（傾向を読ませない）
  quizQ = first8.map(q=>({...q, opts:shuffle(q.opts)}));
  window._remaining = remaining; // 動的分別用に保持
  window._dynAdded = false;
}
// 8問終了時点で接戦の軸を狙う動的2問を追加
function addDynamicQuestions(){
  if(window._dynAdded) return;
  window._dynAdded = true;
  const d={spot:Math.abs(norm("spot",score.spot)-50),tech:Math.abs(norm("tech",score.tech)-50),free:Math.abs(norm("free",score.free)-50),voc:Math.abs(norm("voc",score.voc)-50)};
  const axesByContest=Object.keys(d).sort((a,b)=>d[a]-d[b]); // 接戦（50に近い）順
  const rem=window._remaining||[];
  const chosen=[];
  for(const ax of axesByContest){
    const cand=rem.filter(q=>q.axis===ax && !chosen.includes(q));
    if(cand.length){chosen.push(cand[Math.floor(Math.random()*cand.length)]);}
    if(chosen.length>=2) break;
  }
  while(chosen.length<2 && rem.length){const c=rem.filter(q=>!chosen.includes(q));if(!c.length)break;chosen.push(c[Math.floor(Math.random()*c.length)]);}
  chosen.forEach(q=>quizQ.push({...q, opts:shuffle(q.opts)}));
}

function renderQ(){
  const q=quizQ[idx];
  el("prog").style.width=(idx/TOTAL_Q*100)+"%";
  el("qcount").textContent=T[lang].qcount(idx+1,TOTAL_Q);
  el("qtext").textContent=q[lang];
  const L=["A","B","C","D"];
  el("opts").innerHTML=q.opts.map((o,i)=>`<button class="opt" data-x="${i}"><b>${L[i]}</b>${o[lang]}</button>`).join("");
  el("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(parseInt(b.getAttribute("data-x"))));
}
function choose(i){
  const s=quizQ[idx].opts[i].s;
  score.spot+=s.spot;score.tech+=s.tech;score.free+=s.free;score.voc+=s.voc;
  idx++;
  if(idx===8){ addDynamicQuestions(); }   // 8問終えたら接戦軸の動的2問を追加
  if(idx>=quizQ.length){ finish(); } else { renderQ(); }
}
function finish(){
  resultKey=judge(score);renderResult();show("s-result");
  // ── 結果演出（到達時1回・言語切替の renderResult では発動させない）──
  // PartTest は2値診断（普通/レア）。スコアカウントが無いため revealBadge で結果名を登場。
  if(window.BS_RESULT){
    BS_RESULT.revealBadge({
      host:    el("resCard"),
      badgeEl: el("rName"),                 // 結果タイプ名を flip 登場
      rare:    !!RARE[resultKey],           // レア5タイプ=別格演出 / 普通5タイプ=控えめ
      style:   'flip',
      accent:  '#ffd23f',                   // ゴールド系グロー（--accent2 相当）
      suspenseMs: 2000,                     // カウント不可のため「診断中…」で約2秒稼ぐ
      // 演出後に表示（キャラ・タグ・レアバッジ・紹介文・軸バー）
      revealEls: ['rEmoji','rTag','rRare','rBody','rBars']
    });
  }
  if(window.BS_ANALYTICS){
    BS_ANALYTICS.trackResult({ resultLabel: resultKey });
  }
}

function renderResult(){
  const r=RESULTS[resultKey], L=r[lang];
  // キャラ画像があれば画像、なければ絵文字（後から CHAR_IMG にURL/dataURIを入れるだけで差し替え可能）
  if(typeof CHAR_IMG!=="undefined" && CHAR_IMG[resultKey]){
    el("rEmoji").innerHTML=`<img src="${CHAR_IMG[resultKey]}" alt="" class="char-img">`;
  }else{
    el("rEmoji").textContent=r.emoji;
  }
  el("rName").textContent=L.name;
  el("rTag").textContent=L.tag;
  el("rRare").innerHTML = RARE[resultKey] ? `<span class="res-rare">${T[lang].rare}</span>` : "";
  el("rBody").innerHTML=L.body.split("\n").map(p=>`<p style="margin:0 0 12px">${p}</p>`).join("");
  // 軸バー：生成時点で最終widthを直接書き込み（実機で確実に表示）
  const ax=T[lang].axis;
  const rows=[["spot",ax.spot],["tech",ax.tech],["free",ax.free],["voc",ax.voc]];
  el("rBars").innerHTML=rows.map(([k,lab])=>{
    const val=Math.max(6,Math.min(100,Math.round(norm(k,score[k]))));
    return `<div class="bar-row"><span class="lab">${lab}</span><span class="bar-track"><i class="bar-fill" style="width:${val}%"></i></span></div>`;
  }).join("");
  applyShareMode();
  setLogos();
  renderQR();
}
function applyShareMode(){
  if(!resultKey) return;
  const r=RESULTS[resultKey], L=r[lang];
  if(shareMode==="open"){
    el("rShare").textContent = T[lang].shareOpen(L.name, r.emoji);
    el("togOpen").classList.add("on"); el("togHide").classList.remove("on");
    el("resCard").classList.remove("hidden");
  }else{
    el("hideShare").textContent = T[lang].shareHide(L.name, r.emoji);
    el("togHide").classList.add("on"); el("togOpen").classList.remove("on");
    el("resCard").classList.add("hidden");   // 白い霧オーバーレイ表示
  }
}
function renderQR(){
  // 共有QR（公開・非公開の両方）：診断ゲーム専用入口を指す
  let svg;
  try{
    const qr=qrcode(0,"M"); qr.addData(SHARE_URL); qr.make();
    svg=qr.createSvgTag({cellSize:4,margin:2,scalable:true});
  }catch(e){
    svg='<div style="width:84px;height:84px;display:flex;align-items:center;justify-content:center;color:#111;font-size:9px">'+SHARE_URL+'</div>';
  }
  el("qrBox").innerHTML=svg;
  const hq=el("hideQrBox"); if(hq) hq.innerHTML=svg;
}
function copyShare(){
  if(window.BS_ANALYTICS){BS_ANALYTICS.trackShare('copy');}
  const txt=el("rShare").textContent, done=()=>toast(T[lang].copied);
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fb(txt,done));}
  else fb(txt,done);
}
function fb(txt,cb){const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb&&cb();}
function toast(m){const t=el("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600);}
function startQuiz(){if(window.BS_ANALYTICS){BS_ANALYTICS.trackStart();}buildQuiz();idx=0;score={spot:0,tech:0,free:0,voc:0};resultKey=null;renderQ();show("s-quiz");}
function retry(){startQuiz();}

// 3言語スイッチ（中/日/EN）：選択言語へ切替し全画面を再描画
document.querySelectorAll("#bs-lang-switch button").forEach(b=>{
  b.onclick=()=>{const nl=b.getAttribute("data-lang");if(nl===lang)return;lang=nl;applyStatic();renderParts();if(el("s-quiz").classList.contains("on"))renderQ();if(el("s-result").classList.contains("on"))renderResult();};
});
el("startBtn").onclick=startQuiz;
