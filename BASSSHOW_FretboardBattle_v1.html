<script id="game-core">
'use strict';
const FretCore=(()=>{
 const notes=['C','C♯ / D♭','D','D♯ / E♭','E','F','F♯ / G♭','G','G♯ / A♭','A','A♯ / B♭','B'];
 const thresholds=[0,500,1200,2200,3500,5000,6800,8800,11000,13500];
 const tuning=n=>n===5?[43,38,33,28,23]:[43,38,33,28];
 function pool(n,min=0,max=12,only=-1,natural=false){let a=[];tuning(n).forEach((m,s)=>{for(let f=min;f<=max;f++){let note=(m+f)%12;if((only<0||s===only)&&(!natural||[0,2,4,5,7,9,11].includes(note)))a.push({s,f,note,midi:m+f});}});return a;}
 function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
 function deck(pool,random,previous){let a=pool.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}if(a.length>1&&previous&&a[0].s===previous.s&&a[0].f===previous.f)[a[0],a[1]]=[a[1],a[0]];return a;}
 const points=(ms,combo)=>100+Math.round(100*Math.max(0,Math.min(1,(3000-ms)/2700)))+(combo%5===0?50:0);
 const rank=(score,correct,total)=>score>=16000&&correct>=60&&correct===total?10:thresholds.reduce((r,t,i)=>score>=t?i:r,0);
 return {notes,thresholds,tuning,pool,rng,deck,points,rank};
})();
</script>
